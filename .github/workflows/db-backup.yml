# Nightly Supabase backup - commits CSV + SQL dumps to this private repo.
# Setup: repo Settings > Secrets and variables > Actions > New repository secret
# SUPABASE_DB_URL = Supabase connection string (Project Settings > Database, pooler URI port 6543, with password filled in).
name: db-backup
permissions:
  contents: write        # allow the workflow to push the backup commit
on:
  schedule:
    - cron: "30 18 * * *"→ Runs at 18:30   # 18:30 UTC = 02:30 SGT nightly
  workflow_dispatch: {}      # manual run button
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install postgres client 17 (server is PG17; default client 16 refuses to dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Dump full schema+data (SQL)
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version
          mkdir -p backups
          pg_dump "$DB" --no-owner --no-privileges -f backups/lirich_ssot.sql
      - name: Dump each table to CSV
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          mkdir -p backups/csv
          for t in customers sites rate_card bins vehicles drivers factors facilities jobs collections onward_disposal adjustments fuel_log odometer_log maintenance approved_domains portal_accounts; do
            psql "$DB" -c "\copy (select * from $t) to 'backups/csv/$t.csv' with csv header" || true
          done
