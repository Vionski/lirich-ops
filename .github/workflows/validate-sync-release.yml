name: Validate driver sync release

on:
  pull_request:
    paths:
      - "app.js"
      - "sw.js"
      - "supabase/functions/sync/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/validate-sync-release.yml"
  push:
    branches:
      - "codex/sync-egress-hardening"

permissions:
  contents: read

jobs:
  client-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js

      - name: Test compact and legacy sync compatibility
        run: node supabase/tests/compact_sync_client.mjs

      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
