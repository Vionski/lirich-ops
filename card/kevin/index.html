<style>
:root{--brand:#0A1B4D;--brand-dark:#050A30;--orange:#F4831F;--orange-dark:#D96E10;--bg:#F5F6FA;--card:#fff;--ink:#0C1330;--muted:#6E7691;--line:#E3E6F0}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:16px}
.card{width:100%;max-width:420px;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(12,19,48,.12);align-self:flex-start}
.top{background:var(--brand);color:#fff;padding:22px 20px 26px;text-align:center}
.top img{height:44px;width:auto;display:block;margin:0 auto 10px}
.wm{font-family:'Cinzel',Georgia,'Times New Roman',serif;font-weight:700;font-size:20px;letter-spacing:.06em;
  background:linear-gradient(105deg,#6e5312,#c89b18 10%,#ffe9a3 19%,#fffdf4 24%,#e2b31f 32%,#8a6a12 44%,#ffd75e 56%,#fffdf0 64%,#c49a1e 74%,#5e4610 87%,#8a6a1f);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.cn{font-family:'Ma Shan Zheng',KaiTi,STKaiti,'Kaiti SC',cursive;font-size:15px;letter-spacing:.14em;margin-left:8px}
.tag{font-family:'Trebuchet MS',Trebuchet,Helvetica,Arial,sans-serif;font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:#eaf1ff;margin-top:4px}
.who{padding:22px 20px 6px;text-align:center}
.who h1{margin:0;font-size:26px;letter-spacing:.01em}
.who .role{color:var(--orange-dark);font-weight:700;margin-top:4px;font-size:15px}
.who .co{color:var(--muted);font-size:13.5px;margin-top:2px}
.rows{padding:10px 16px 4px}
.row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-size:15px;overflow-wrap:anywhere}
.row:last-child{border-bottom:0}
.row .ic{flex:none;width:34px;height:34px;border-radius:50%;background:#E9EDF8;color:var(--brand);display:grid;place-items:center;font-size:16px}
.row small{display:block;color:var(--muted);font-size:11.5px}
.save{display:block;margin:12px 20px 4px;padding:14px;border-radius:12px;background:var(--orange);color:#fff;text-align:center;font-weight:800;text-decoration:none;font-size:16px}
.save:active{background:var(--orange-dark)}
.qr{text-align:center;padding:14px 20px 22px}
.qr img{width:170px;height:170px;image-rendering:pixelated}
.qr div{color:var(--muted);font-size:12px;margin-top:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070B1F;--card:#10173A;--ink:#EEF1FB;--muted:#A3AACB;--line:#232C55}
  :root:not([data-theme="light"]) .row .ic{background:#1B2452;color:#fff}}
</style>
</head>

    <a class="row" href="tel:+6567930173"><span class="ic">☎️</span><span><small>Office</small>+65 6793 0173</span></a>

    <a class="row" href="https://www.lirichgroup.com"><span class="ic">🌐</span><span><small>Website</small>www.lirichgroup.com</span></a>
