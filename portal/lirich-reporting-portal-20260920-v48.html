<head><script>
/* Land Scope 3 Category 5 (Option C, approved 16 Sep 2026). Normalises the portal
   response before any rendering: the engine returns carbon.land, this view reads the
   older field names. Only fills values the page does not already have, so vessel
   clients are untouched. Land and vessel are never summed. Installed in <head> so it
   wraps fetch before the app captures it. */
(function(){
  var of = window.fetch;
  window.fetch = function(u, o){
    return of.apply(this, arguments).then(function(r){
      try{
        var _u = (typeof u === 'string') ? u : ((u && u.url) ? u.url : String(u));
        if (_u.indexOf('/functions/v1/portal') < 0 && String((r && r.url) || '').indexOf('/functions/v1/portal') < 0) return r;
        return r.clone().text().then(function(t){
          var j; try { j = JSON.parse(t); } catch(e) { return r; }
          var c = j && j.carbon;
          if (c && c.land && Number(c.land.headline_tco2e) > 0) {
            if (!(Number(c.scope_3_category_5_tco2e) > 0)) c.scope_3_category_5_tco2e = c.land.headline_tco2e;
            if (!(Number(c.avoided_tco2e) > 0)) c.avoided_tco2e = c.land.avoided_tco2e;
            return new Response(JSON.stringify(j), {status:r.status, headers:{'Content-Type':'application/json'}});
          }
          return r;
        }).catch(function(){ return r; });
      }catch(e){ return r; }
    });
  };
})();
</script>

          : editing
            ? "Amendment saved."
            : "Pickup requested. Awaiting confirmation.",
      );
      await render();
    } catch (e) {
      const unavailable =
        /slot_unavailable|non_working_day|date_too_early|service_not_available/.test(
          e.code || e.message,
        );
      toast(
        unavailable
          ? "That slot is unavailable. Choose another date or time."
          : e.code === "contact_lirich_required"
            ? "Please contact Lirich to change this service."
            : e.message,
      );
    } finally {
      if (button) button.disabled = false;
    }
  }
  async function cancelBooking(reference) {
    if (!confirm(`Cancel ${reference}?`)) return;
    try {
      const result = await bookingApi("cancel", {
        method: "POST",
        body: JSON.stringify({ reference, request_key: crypto.randomUUID() }),
      });
      toast(
        result.duplicate
          ? "Cancellation was already recorded."
          : "Booking cancelled.",
      );
      await render();
    } catch (e) {
      toast(
        e.code === "contact_lirich_required"
          ? "Please contact Lirich to change this service."
          : e.message,
      );
    }
  }
  function bookingEvents(e) {
    const target = e.target.closest?.("button");
    if (
      target?.id === "book-pickup" ||
      target?.classList.contains("book-pickup")
    ) {
      state.section = "bookings";
      if (el("booking-form")) showBookingForm();
      else render().then(() => showBookingForm());
    } else if (target?.id === "bk-close") {
      state.editBooking = null;
      el("booking-form")?.classList.add("hidden");
    } else if (target?.id === "bk-submit") submitBooking();
    else if (target?.classList.contains("bk-edit"))
      showBookingForm(target.dataset.reference);
    else if (target?.classList.contains("bk-cancel"))
      cancelBooking(target.dataset.reference);
    if (e.type === "change" && e.target.id === "bk-site") fillBookingServices();
  }
  function signOffCard(o) {
      if (window.LR_OWNER !== true) return "";
      const list = (o && o.periods) || [];
      const tip = "Lirich sign-off on a reporting period. Staff only \u2014 the client never sees these controls. A period can be signed only when the selected dates are exactly one stored reporting period, so use the Period presets to pick a single month.";
      const head = "<article class=\"card\"><h2 title=\"" + tip + "\">Period sign-off " + INFO + "</h2>";
      const match = list.filter((x) => String(x.period_start) === String(state.from) && String(x.period_end) === String(state.to))[0];
      if (!match) {
        return head + "<p>The selected dates are not a single reporting period, so nothing can be signed here. Use the <b>Period</b> presets above to choose one month.</p><p><small>" + esc(String(list.length)) + " reporting period(s) overlap the selected range.</small></p></article>";
      }
      const who = match.assessed_by ? ("portal account " + esc(String(match.assessed_by))) : "not signed";
      const when = match.assessed_at ? esc(String(match.assessed_at).slice(0, 10)) : "\u2014";
      return head + "<dl class=\"facts\"><dt>Period</dt><dd>" + esc(String(match.label || (match.period_start + " to " + match.period_end))) + "</dd><dt>Status</dt><dd>" + status(String(match.status || "")) + "</dd><dt>Signed by</dt><dd>" + who + "</dd><dt>Signed on</dt><dd>" + when + "</dd></dl><div class=\"button-row\"><button class=\"button secondary\" data-assess=\"in_review\">Mark in review</button><button class=\"button secondary\" data-assess=\"data_gaps\">Mark data gaps</button><button class=\"button\" data-assess=\"ready\">Sign off as ready</button></div></article>";
    }
    async function staffAction(route, payload) {
    try {
      await api(route, {
        method: "POST",
        body: JSON.stringify({
          client: state.client,
          from: state.from,
          to: state.to,
          ...payload,
        }),
      });
      state.cache.clear();
      toast("Update recorded in the audit trail.");
      render();
    } catch (e) {
      toast(e.message);
    }
  }
  async function init() {
    defaultDates();
    nav();
    const openSidebar = () => {
      document.body.classList.add("sidebar-opened");
      el("sidebar-scrim").classList.remove("hidden");
    };
    const closeSidebar = () => {
      document.body.classList.remove("sidebar-opened");
      el("sidebar-scrim").classList.add("hidden");
    };
    el("sidebar-open").onclick = openSidebar;
    el("sidebar-close").onclick = closeSidebar;
    el("sidebar-scrim").onclick = closeSidebar;
    el("nav").onclick = (e) => {
      const b = e.target.closest("[data-section]");
      if (b) {
        state.section = b.dataset.section;
        closeSidebar();
        render();
      }
    };
    el("refresh").onclick = () => {
      state.cache.clear();
      render();
    };
    el("period-preset").onchange = () => {
        const v = el("period-preset").value;
        if (!v) return;
        const pad = (n) => (n < 10 ? "0" + n : String(n));
        const iso = (yy, mm, dd) => yy + "-" + pad(mm) + "-" + pad(dd);
        const eom = (yy, mm) => new Date(Date.UTC(yy, mm, 0)).getUTCDate();
        const now = new Date();
        const y = now.getUTCFullYear();
        const m = now.getUTCMonth() + 1;
        let lm = m - 1, ly = y;
        if (lm === 0) { lm = 12; ly = y - 1; }
        const today = iso(y, m, now.getUTCDate());
        let f = "", t2 = "";
        if (v === "m1") { f = iso(ly, lm, 1); t2 = iso(ly, lm, eom(ly, lm)); }
        else if (v === "m3") { let sy = ly, sm = lm - 2; while (sm <= 0) { sm += 12; sy -= 1; } f = iso(sy, sm, 1); t2 = iso(ly, lm, eom(ly, lm)); }
        else if (v === "qtd") { f = iso(y, Math.floor((m - 1) / 3) * 3 + 1, 1); t2 = today; }
        else if (v === "q1") { let qs = Math.floor((m - 1) / 3) * 3 + 1 - 3, qy = y; if (qs <= 0) { qs += 12; qy -= 1; } const qe = qs + 2; f = iso(qy, qs, 1); t2 = iso(qy, qe, eom(qy, qe)); }
        else if (v === "ytd") { f = iso(y, 1, 1); t2 = today; }
        el("period-from").value = f;
        el("period-to").value = t2;
        state.from = f;
        state.to = t2;
        state.cache.clear();
        render();
      };
      for (const id of ["period-from", "period-to"])
        el(id).addEventListener("change", () => { el("period-preset").value = ""; });
      for (const id of ["period-from", "period-to"])
      el(id).onchange = () => {
        state.from = el("period-from").value;
        state.to = el("period-to").value;
        state.cache.clear();
        render();
      };
    try {
      state.session = await api("bootstrap", { timeoutMs: 8000 });
      window.LR_OWNER =
        state.session.account.role === "admin" &&
        String(state.session.account.wp_login || "").toLowerCase() ===
          "mondayblossomdesigns";
      if (window.LR_OWNER) {
        const staffOnlyStyle = el("lr-staff-only");
        if (staffOnlyStyle) staffOnlyStyle.remove();
      }
      const display =
          state.session.account.display_name || state.session.account.wp_login,
        initials = display
          .split(/\s+/)
          .map((x) => x[0])
          .join("")
          .slice(0, 2)
          .toUpperCase();
      el("identity").innerHTML =
        `<strong>${esc(initials || "LR")}</strong><small>${esc(title(state.session.account.role))}</small>`;
      if (state.session.staff) {
        const d = { clients: state.session.clients || [] };
        el("client-control").classList.remove("hidden");
        el("client-select").innerHTML =
          `<option value="">Select client…</option>` +
          d.clients
            .map(
              (c) =>
                `<option value="${esc(c.client_id)}">${esc(c.name)}</option>`,
            )
            .join("");
        const choose = async () => {
          state.client = el("client-select").value;
          const selected = d.clients.find((c) => c.client_id === state.client);
          el("workspace-client").textContent =
            selected?.name || "Select a client";
          el("account-card").querySelector("strong").textContent =
            selected?.name || "Staff reporting workspace";
          state.cache.clear();
          const lastClientKey = `lr:last-client:${state.session.account.wp_login}`;
          if (state.client) {
            try { sessionStorage.setItem(lastClientKey, state.client); } catch (_) {}
            await render();
          }
          else
            el("content").innerHTML =
              `<div class="empty">Select a client to open the reporting workspace.</div>`;
        };
        el("client-select").onchange = choose;
        el("workspace-client").textContent = "Staff reporting workspace";
        el("account-card").querySelector("strong").textContent =
          "Authorised staff access";
        el("content").innerHTML =
          `<div class="empty">Select a client to open the reporting workspace.</div>`;
        const lastClientKey = `lr:last-client:${state.session.account.wp_login}`;
        let lastClient = "";
        try { lastClient = sessionStorage.getItem(lastClientKey) || ""; } catch (_) {}
        if (d.clients.some((client) => client.client_id === lastClient)) {
          el("client-select").value = lastClient;
          await choose();
        }
      } else {
        state.client = state.session.account.client_id;
        el("workspace-client").textContent = display;
        el("account-card").querySelector("strong").textContent = display;
        render();
      }
      el("app").setAttribute("aria-busy", "false");
    } catch (e) {
      el("content").innerHTML =
        `<div class="error"><strong>Secure session unavailable</strong><br>${esc(e.message)}</div>`;
    }
  }
  window.addEventListener("DOMContentLoaded", () => {
    el("content").addEventListener("click", bookingEvents);
    el("content").addEventListener("change", bookingEvents);
    init();
    if (window.parent !== window && "ResizeObserver" in window)
      new ResizeObserver(() =>
        window.parent.postMessage(
          {
            type: "lirich:height",
            height: document.documentElement.scrollHeight,
          },
          location.origin,
        ),
      ).observe(document.body);
  });
})();

</script>
<script>
/* Staff-only sections. Carbon is unreleased; Report Builder is a Lirich tool.
   Hidden by CSS from first paint and only revealed once the portal session
   confirms the owner. Fail-closed: if bootstrap fails, they stay hidden.
   Independent of render order, and survives nav re-renders because it is CSS. */
(function(){
  var css='nav#nav button[data-section="builder"]{display:none !important}';
  var st=document.createElement('style');
  st.id='lr-staff-only'; st.textContent=css;
  (document.head||document.documentElement).appendChild(st);
})();
</script>
